<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive, child-friendly quiz website designed for 4th-grade students to learn about Dengue fever, mosquito breeding prevention, and safety guidelines.">
  <title>Dengue Champions Quiz! 🦟🔍</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Header Section -->
    <header>
      <div class="brand-area" title="Double-click logo to reset progress">
        <!-- Cute Custom Logo SVG (Target/Mosquito style) -->
        <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="6" opacity="0.15" />
          <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6" opacity="0.3" />
          <!-- Mosquito vector icon -->
          <path d="M50,30 C45,35 48,45 50,50 C52,45 55,35 50,30 Z" fill="currentColor" />
          <!-- Wings -->
          <path d="M35,42 C20,40 22,50 35,48 Z" fill="currentColor" opacity="0.7" />
          <path d="M65,42 C80,40 78,50 65,48 Z" fill="currentColor" opacity="0.7" />
          <!-- Legs -->
          <path d="M42,55 Q35,62 30,60" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M58,55 Q65,62 70,60" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M45,65 Q38,75 35,75" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M55,65 Q62,75 65,75" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" />
        </svg>
        <div class="title-container">
          <h1>Dengue Champions!</h1>
          <p>Become a Health Detective & Fight Mosquitoes</p>
        </div>
      </div>
      
      <!-- Total Score Display -->
      <div class="score-badge" id="total-score-badge" aria-label="Stars collected">
        <span role="img" aria-label="star">⭐</span>
        <span id="total-score">0</span> / 100 Stars
      </div>
    </header>

    <!-- Navigation Level Selector tabs -->
    <nav class="level-selector-nav" aria-label="Difficulty Levels">
      <button class="level-tab active" data-level="easy" id="tab-easy">
        <span>🟢</span> Easy Level
      </button>
      <button class="level-tab" data-level="moderate" id="tab-moderate">
        <span>🟡</span> Moderate Level
      </button>
      <button class="level-tab" data-level="veryHard" id="tab-veryHard">
        <span>🔴</span> Very Hard
      </button>
    </nav>

    <!-- Mascot Speech Box -->
    <section class="mascot-helper-section" aria-label="Mascot Guidance">
      <div class="mascot-wrapper">
        <!-- Detective Dani Mascot SVG -->
        <svg class="mascot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Deerstalker Hat Back flaps -->
          <path d="M24,40 Q12,45 22,54 Z" fill="#8d5b4c" />
          <path d="M76,40 Q88,45 78,54 Z" fill="#8d5b4c" />
          
          <!-- Cute Torso/Shoulders -->
          <path d="M30,86 Q50,76 70,86 L65,100 L35,100 Z" fill="#e74c3c" />
          <path d="M50,76 L50,100" stroke="#c0392b" stroke-width="3" />
          <circle cx="50" cy="88" r="2.5" fill="#f1c40f" />
          
          <!-- Cute Face -->
          <circle cx="50" cy="62" r="25" fill="#ffd1b3" />
          
          <!-- Blushing Cheeks -->
          <circle cx="33" cy="67" r="4" fill="#ff7f7f" opacity="0.55" />
          <circle cx="67" cy="67" r="4" fill="#ff7f7f" opacity="0.55" />
          
          <!-- Happy Eyes -->
          <circle cx="41" cy="59" r="4" fill="#2c3e50" />
          <circle cx="59" cy="59" r="4" fill="#2c3e50" />
          <!-- White eye sparkles -->
          <circle cx="42.5" cy="57.5" r="1.5" fill="#ffffff" />
          <circle cx="60.5" cy="57.5" r="1.5" fill="#ffffff" />
          
          <!-- Smile -->
          <path d="M46,69 Q50,74 54,69" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" fill="none" />
          
          <!-- Deerstalker Detective Hat -->
          <path d="M22,46 Q50,15 78,46 Z" fill="#a06a5a" />
          <path d="M18,46 Q50,42 82,46" stroke="#5c382e" stroke-width="4.5" stroke-linecap="round" fill="none" />
          <circle cx="50" cy="20" r="3.5" fill="#5c382e" />
          
          <!-- Magnifying Glass overlaying Right Eye (Playful graphic) -->
          <circle cx="59" cy="59" r="11" stroke="#f1c40f" stroke-width="3.5" fill="rgba(52, 152, 219, 0.28)" />
          <line x1="67" y1="67" x2="77" y2="77" stroke="#d35400" stroke-width="5" stroke-linecap="round" />
        </svg>
      </div>
      
      <!-- Speech bubble containing instructions and explanations -->
      <div class="speech-bubble" id="mascot-speech" role="status" aria-live="polite">
        <p id="mascot-bubble-text">Loading instructions...</p>
      </div>
    </section>

    <!-- Quiz Subtitle / Current Page Title -->
    <div class="level-info-header">
      <h2 class="level-title-label" id="level-title-text">🟢 Easy Level</h2>
      <span class="page-counter-badge" id="current-page-label">Page 1 of 4</span>
    </div>

    <!-- Questions Container -->
    <main class="quiz-section" id="questions-container" aria-label="Dengue Quiz Questions">
      <!-- Questions will be injected here dynamically by app.js -->
    </main>

    <!-- Bottom Control Panel: Progress Track & Page Navigation -->
    <section class="bottom-control-panel" aria-label="Quiz controls">
      <div class="progress-info">
        <span class="progress-label" id="progress-label-text">0 of 10 answered</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      
      <div class="nav-buttons-group">
        <button class="nav-btn" id="btn-prev" disabled aria-label="Previous Page">
          ◀ Prev Page
        </button>
        <button class="nav-btn" id="btn-next" aria-label="Next Page">
          Next Page ▶
        </button>
      </div>
    </section>

  </div>

  <!-- Confetti particle container -->
  <div id="confetti-container" aria-hidden="true"></div>

  <!-- Javascript Modules inclusion -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
